# Default configuration of parallel_matrix_formatter.
#
# Copy this file to config/parallel_matrix_formatter.yml (or
# parallel_matrix_formatter.yml) in your project and change what you like.
# Keys you leave out fall back to the values below.

# Redirect stdout and stderr of every test process to /dev/null so application
# output cannot corrupt the display. This hides crashes too: set it to false
# when something goes wrong and you need to see why.
suppress_output: true

# Ten characters that replace the digits 0-9 in the time and the percentages,
# e.g. "ﾛｲｸﾖﾑﾗﾚﾇﾒﾜ". Leave empty to keep plain digits.
digits: ""

# When to print a fresh progress line. The first rule that applies wins.
progress_update:
  always: false            # after every example
  interval_seconds: 60     # at most once per interval, plus once when every process is done; 0 disables
  percent_threshold: 0     # whenever any process advances by this many percent; 0 disables

# The line showing every process's progress, e.g. "17:04:13 ｷｺｼ89%ﾚﾐｴ､ｷｦｻ92%ｸｪｨｹ".
# Placeholders: {time}, {columns}.
progress_line:
  format: "\n{time} {columns} "
  # One column per process: its percentage surrounded by random "rain" symbols.
  column:
    width: 10
    align: center          # left, center or right
    color: red
    pad_symbols: "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝｦｧｨｩｪｫｬｭｮｯｰ｢｣､"
    pad_color: green

# The symbol printed after every example.
# Placeholders: {symbol}, {process_letter} (A for process 1, B for process 2, ...).
example_status:
  format: "{symbol}"
  # One random character of the string is picked each time.
  symbols:
    passed: "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝｦｧｨｩｪｫｬｭｮｯｰ｢｣､"
    failed: "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝｦｧｨｩｪｫｬｭｮｯｰ｢｣､"
    pending: "🥄"
  # Any color RSpec knows: black, red, green, yellow, blue, magenta, cyan, white, bold_red, ...
  colors:
    passed: green
    failed: red
    pending: yellow
