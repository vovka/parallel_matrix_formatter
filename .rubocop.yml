AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

Metrics/ClassLength:
  Max: 100

Metrics/MethodLength:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Every class and module carries a comment already; the cop would also demand one on the namespace modules.
Style/Documentation:
  Enabled: false

# Silencing works on the real file descriptors, so the constants are the point.
Style/GlobalStdStream:
  Enabled: false
